# App Pitbull Barber: 2 réplicas (sessões ficam no Postgres, então tanto faz qual réplica atende).
apiVersion: v1
kind: ConfigMap
metadata:
  name: pitbull-config
  namespace: pitbull
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/barbearia
  SPRING_DATASOURCE_USERNAME: barbearia
  TZ: America/Sao_Paulo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pitbull-app
  namespace: pitbull
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: pitbull-app
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        app: pitbull-app
    spec:
      # espera o Postgres aceitar conexões antes de subir o app (evita reinícios no primeiro deploy)
      initContainers:
        - name: espera-postgres
          image: postgres:17-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432 -U barbearia; do echo aguardando postgres; sleep 2; done"]
      containers:
        - name: app
          image: pitbull-barber:1.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: pitbull-config
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: pitbull-segredos, key: DB_SENHA } }
            - name: ADMIN_SENHA
              valueFrom: { secretKeyRef: { name: pitbull-segredos, key: ADMIN_SENHA } }
            - name: GOOGLE_CLIENT_ID
              valueFrom: { secretKeyRef: { name: pitbull-segredos, key: GOOGLE_CLIENT_ID } }
            - name: GOOGLE_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: pitbull-segredos, key: GOOGLE_CLIENT_SECRET } }
            # e-mail de confirmação (opcional: sem estas chaves o app funciona, só não envia e-mail)
            - name: MAIL_USUARIO
              valueFrom: { secretKeyRef: { name: pitbull-segredos, key: MAIL_USUARIO, optional: true } }
            - name: MAIL_SENHA
              valueFrom: { secretKeyRef: { name: pitbull-segredos, key: MAIL_SENHA, optional: true } }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36   # até 3 min para subir
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: pitbull-app
  namespace: pitbull
spec:
  type: LoadBalancer
  selector:
    app: pitbull-app
  ports:
    - name: http
      port: 8090
      targetPort: http
