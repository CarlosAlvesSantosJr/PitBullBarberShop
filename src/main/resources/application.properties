spring.application.name=agendamento

# Segredos locais (fora do git). Em Docker/K8s use variaveis de ambiente.
spring.config.import=optional:file:./segredos.properties
server.port=8080

# PERFORMANCE: compressao gzip e cache dos arquivos estaticos
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,text/javascript,application/json,application/manifest+json,image/svg+xml
server.compression.min-response-size=1024
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.use-last-modified=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.jackson.default-property-inclusion=non_null

# Atras de proxy/tunel HTTPS: respeita X-Forwarded-Proto/Host (links e OAuth com https)
server.forward-headers-strategy=framework

# SESSOES no banco: varias replicas compartilham o login (tabelas criadas pela migration V15)
spring.session.jdbc.initialize-schema=never
spring.session.timeout=8h

# HEALTH CHECKS (Kubernetes: /actuator/health/liveness e /readiness)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.mail.enabled=false

# BANCO (sobrescreva com SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD)
spring.datasource.url=jdbc:postgresql://localhost:5432/barbearia
spring.datasource.username=postgres
spring.datasource.password=${DB_SENHA:}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.lob.non_contextual_creation=true

#FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.placeholders.schema=public
spring.flyway.baseline-version=0

#EMAIL
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USUARIO:}
spring.mail.password=${MAIL_SENHA:}
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8

# Propriedades específicas do protocolo
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

#GOOGLE OAUTH2 (valores em variaveis de ambiente GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:desativado}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:desativado}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google
